name: 🏠 Build & Push Home Service System

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"          # trigger on version tags like v1.0.0
  pull_request:
    branches:
      - main
      - master

env:
  IMAGE_NAME: home-service-system   # change to your preferred image name
  REGISTRY: docker.io

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Test the application
  # ─────────────────────────────────────────
  test:
    name: 🧪 Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --only=production

      - name: Start app and verify hostname endpoint
        run: |
          node app.js &
          APP_PID=$!
          sleep 2
          echo "Testing /health endpoint..."
          curl -f http://localhost:3000/health
          echo ""
          echo "Testing /api/hostname endpoint..."
          curl -f http://localhost:3000/api/hostname
          echo ""
          kill $APP_PID
          echo "✅ All endpoint tests passed!"

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Docker Image
  # ─────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                      # only runs if test job passes

    # Only push on main/master branch or version tags, not on PRs
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up QEMU for multi-platform builds ──
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── Set up Docker Buildx ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log in to Docker Hub ──
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Generate image metadata/tags ──
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with branch name on push to main/master
            type=ref,event=branch
            # Tag with PR number on pull requests
            type=ref,event=pr
            # Tag semver releases  (e.g. v1.2.3 → 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Always tag latest on default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with short git SHA for traceability
            type=sha,prefix=sha-,format=short

      # ── Build and push the image ──
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64    # multi-arch support
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Print image digest for verification ──
      - name: Image digest
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 Digest: ${{ steps.build-and-push.outputs.digest }}"
          echo "🏷️  Tags:"
          echo "${{ steps.meta.outputs.tags }}"

  # ─────────────────────────────────────────
  # JOB 3: Security Scan (after push)
  # ─────────────────────────────────────────
  scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          format: "table"
          exit-code: "0"             # don't fail the pipeline, just report
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
